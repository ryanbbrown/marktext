<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Element UI Table Test</title>
  <!-- Element UI CSS -->
  <link rel="stylesheet" href="https://unpkg.com/element-ui@2.15.8/lib/theme-chalk/index.css">
  <!-- Vue 2 -->
  <script src="https://unpkg.com/vue@2.6.14/dist/vue.js"></script>
  <!-- Element UI JS -->
  <script src="https://unpkg.com/element-ui@2.15.8/lib/index.js"></script>
</head>
<body>
  <div id="app" style="padding: 20px;">
    <h2>Element UI 2.15.8 Table Test</h2>

    <el-table :data="tableData" border style="width: 100%">
      <el-table-column prop="date" label="Date" width="180"></el-table-column>
      <el-table-column prop="name" label="Name" width="180"></el-table-column>
      <el-table-column prop="address" label="Address"></el-table-column>
    </el-table>
  </div>

  <script>
    new Vue({
      el: '#app',
      data() {
        return {
          tableData: [
            { date: '2016-05-03', name: 'Tom', address: 'No. 189, Grove St, Los Angeles' },
            { date: '2016-05-02', name: 'Tom', address: 'No. 189, Grove St, Los Angeles' },
            { date: '2016-05-04', name: 'Tom', address: 'No. 189, Grove St, Los Angeles' },
            { date: '2016-05-01', name: 'Tom', address: 'No. 189, Grove St, Los Angeles' }
          ]
        }
      }
    })
  </script>
</body>
</html>
